name: Bug report
description: A command or the dashboard did not do what you expected.
body:
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The output of `git rev-parse --short HEAD` in your clone.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Python version
      description: For example Windows 11 and Python 3.12.4.
    validations:
      required: true
  - type: textarea
    id: action
    attributes:
      label: Command or dashboard action
      description: The command you ran, or the page and the control you used on the dashboard.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Full output or the error the dashboard showed
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
