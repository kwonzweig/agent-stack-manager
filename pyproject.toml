[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-stack-manager"
version = "0.1.0"
description = "Agent skills, stacks and presets kept in one place as Microsoft APM packages, with a local dashboard and automatic export to Paperclip."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.urls]
Repository = "https://github.com/kwonzweig/agent-stack-manager"

[project.optional-dependencies]
apm = ["apm-cli==0.35.1"]

[project.scripts]
agent-stack-manager = "asm_app.cli:main"

[tool.setuptools.packages.find]
include = ["asm_app*"]

[tool.setuptools.package-data]
asm_app = ["web/*"]
